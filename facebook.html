<html>
<head>
    <title>Facebook Login</title>

    <style>
        body {
            background-color: white;
            text-align: center;
            margin-top: 100px;
        }
        h1 {
            color: blue;
            font-size: 50px;
            margin-bottom: 20px;
        }

        .login-box {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 10px lightgray;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
            font-size: 16px;
            border: 1px solid lightgray;
            border-radius: 5px;
        }

        .login-button {
            width: 90px;
            padding: 12px;
            margin-top: 10px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }

        #b1:hover {
            background-color:blue;
        }

        a {
            color: #1877f2;
            text-decoration: none;
            font-size: 14px;
        }

        hr {
            margin: 20px 0;
            border: 1px solid #ddd;
        }

        .create-button {
            background-color: #42b72a;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
        }

        .create-button:hover {
            background-color: #36a420;
        }
    </style>
</head>

<body>

    <h1>facebook</h1>

    <div class="login-box">

        <form>

            <input type="text"
                   placeholder="Email address or phone number">

            <br>

            <input type="password"
                   placeholder="Password">

            <br>

            <button class="login-button" type="submit">
                Log in
            </button>

        </form>

        <br>

        <a href="#">Forgotten password?</a>

        <hr>

        <button class="create-button">
            Create new account
        </button>

    </div>

</body>
</html>
